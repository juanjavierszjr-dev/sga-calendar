name: Sincronizador SGA UTEQ a iCal

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 ics pytz

      - name: Ejecutar Extractor SGA UTEQ
        env:
          SGA_USUARIO: ${{ secrets.SGA_USUARIO }}
          SGA_PASS: ${{ secrets.SGA_PASS }}
        run: python sga_calendar.py

      - name: Publicar archivo en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: .
